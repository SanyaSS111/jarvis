# `lite` agent preset: a trimmed copy of the shipped `standard` preset for slow
# local models. It keeps the everyday tools and drops the heavy tool catalogs
# (subagents, workflows, Ralph, plan mode, goals, skills) so the system prompt
# stays short and the first response on llama.cpp arrives sooner.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}. Always reply in Russian.
    prefix: >-
      You are a coding agent powered by the {{model}} model.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 16384

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# Image generation through ComfyUI (tools\mcp\comfyui): one small tool. With a local model loaded the
# picture is drawn in the memory left over, and ComfyUI is unloaded afterwards so the model keeps its speed.
- id: mcp-comfyui
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    transport: stdio
    serverName: comfyui
    command: C:\Program Files\nodejs\node.exe
    args: ['C:\LLM\tools\mcp\comfyui\server.js']
    toolCallTimeoutMs: 1800000